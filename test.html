<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oxygen to Bricks Converter - Test Runner</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            background-color: #f5f5f7;
        }
        h1 {
            color: #6873E5;
        }
        .test-container {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            padding: 2rem;
            margin-bottom: 2rem;
        }
        .results {
            background-color: #1e1e1e;
            color: #f1f1f1;
            border-radius: 6px;
            padding: 1rem;
            font-family: monospace;
            white-space: pre-wrap;
            overflow-x: auto;
            max-height: 600px;
            overflow-y: auto;
        }
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            background-color: #6873E5;
            color: white;
            margin-bottom: 1rem;
        }
        .btn:hover {
            background-color: #5562E0;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(104, 115, 229, 0.3);
        }
        .pass {
            color: #45B96F;
        }
        .fail {
            color: #E54D4D;
        }
    </style>
</head>
<body>
    <h1>Oxygen to Bricks Converter - Test Runner</h1>
    
    <div class="test-container">
        <button id="run-test" class="btn">Run Tests</button>
        <div id="results" class="results">
            Test results will appear here...
        </div>
    </div>

    <script type="module">
        import { buildBricksJson } from './transformers/tree.js';
        
        // Test examples
        const testCases = [
            {
                name: "Basic Text Block with Class",
                input: {
                    "component": {
                        "id": 13,
                        "name": "ct_text_block",
                        "options": {
                            "ct_id": 13,
                            "ct_parent": 0,
                            "selector": "text_block-13-128",
                            "original": {},
                            "nicename": "Text (#13)",
                            "ct_content": "This is a block of text. Double-click this text to edit it.",
                            "classes": ["test-my-bg"],
                            "activeselector": "test-my-bg"
                        },
                        "depth": 1
                    },
                    "classes": {
                        "test-my-bg": {
                            "original": {
                                "background-color": "#b50707"
                            },
                            "key": "test-my-bg"
                        }
                    }
                },
                expectedElementType: "text-basic",
                expectedTextContent: "This is a block of text. Double-click this text to edit it.",
                expectedClassCount: 1,
                expectedClassStyles: {
                    _background: {
                        color: { hex: "#b50707" }
                    }
                }
            },
            {
                name: "Rich Text with Typography Properties",
                input: {
                    "component": {
                        "id": 9,
                        "name": "oxy_rich_text",
                        "figma_id": "135:4878",
                        "children": [],
                        "options": {
                            "ct_id": 9,
                            "ct_parent": 5,
                            "original": [],
                            "nicename": "Title",
                            "selector": "_rich_text-9-128",
                            "classes": ["ptn-card__title"],
                            "media": {"phone-landscape": {"original": []}},
                            "ct_content": "Bundespräsident Alexander Van der Bellen zu Besuch bei PlayTogetherNow",
                            "activeselector": "ptn-card__title"
                        },
                        "depth": 4
                    },
                    "classes": {
                        "ptn-card__title": {
                            "key": "ptn-card__title",
                            "media": {"phone-landscape": {"original": {}}},
                            "original": {
                                "font-family": "Roboto",
                                "line-height-unit": "%",
                                "letter-spacing-unit": "%",
                                "font-size": "32",
                                "font-weight": "700",
                                "line-height": "1.2",
                                "letter-spacing": "0",
                                "text-align": "left",
                                "text-decoration": "none",
                                "flex-grow": "0",
                                "border-width": "1",
                                "color": "#090404",
                                "flex-shrink": "1",
                                "flex-basis": "auto"
                            }
                        }
                    }
                },
                expectedElementType: "text",
                expectedTextContent: "Bundespräsident Alexander Van der Bellen zu Besuch bei PlayTogetherNow",
                expectedClassCount: 1,
                expectedClassStyles: {
                    _typography: {
                        "font-family": "Roboto",
                        "font-size": "32",
                        "font-weight": "700",
                        "line-height": "1.2",
                        "letter-spacing": "0",
                        "text-align": "left",
                        "text-decoration": "none",
                        color: { hex: "#090404" }
                    },
                    _border: {
                        width: {
                            top: "1",
                            right: "1",
                            bottom: "1",
                            left: "1"
                        }
                    },
                    _layout: {
                        "flex-grow": "0",
                        "flex-shrink": "1",
                        "flex-basis": "auto"
                    }
                }
            }
        ];

        // Format output with color highlighting
        function formatOutput(message, type = 'log') {
            if (type === 'pass') {
                return `<span class="pass">${message}</span>`;
            } else if (type === 'fail') {
                return `<span class="fail">${message}</span>`;
            } else {
                return message;
            }
        }

        // Run tests and output results to the DOM
        async function runTests() {
            const resultsEl = document.getElementById('results');
            resultsEl.innerHTML = '🧪 Running Oxygen to Bricks converter tests...\n\n';
            
            let passedTests = 0;
            
            for (const testCase of testCases) {
                resultsEl.innerHTML += `\n📋 Test: ${testCase.name}\n`;
                
                try {
                    // Convert using our refactored code
                    const result = buildBricksJson(testCase.input);
                    
                    // Verify element type
                    const element = result.content[0];
                    const elementTypeValid = element.name === testCase.expectedElementType;
                    resultsEl.innerHTML += elementTypeValid 
                        ? formatOutput(`✓ Element type: PASS (${element.name})\n`, 'pass')
                        : formatOutput(`❌ Element type: FAIL (expected: ${testCase.expectedElementType}, got: ${element.name})\n`, 'fail');
                    
                    // Verify text content
                    const textContentValid = element.settings.text === testCase.expectedTextContent;
                    resultsEl.innerHTML += textContentValid
                        ? formatOutput(`✓ Text content: PASS\n`, 'pass')
                        : formatOutput(`❌ Text content: FAIL\n`, 'fail');
                    
                    // Verify class count
                    const classCountValid = result.globalClasses.length === testCase.expectedClassCount;
                    resultsEl.innerHTML += classCountValid
                        ? formatOutput(`✓ Class count: PASS (${result.globalClasses.length})\n`, 'pass')
                        : formatOutput(`❌ Class count: FAIL (expected: ${testCase.expectedClassCount}, got: ${result.globalClasses.length})\n`, 'fail');
                    
                    // Verify class applied to element
                    const hasClassApplied = element.settings._cssGlobalClasses && 
                                         element.settings._cssGlobalClasses.length === testCase.expectedClassCount;
                    resultsEl.innerHTML += hasClassApplied
                        ? formatOutput(`✓ Class applied: PASS\n`, 'pass')
                        : formatOutput(`❌ Class applied: FAIL\n`, 'fail');
                    
                    // Verify class styles
                    const globalClass = result.globalClasses[0];
                    const classStyles = globalClass.settings;
                    
                    // Check each expected property group
                    let allStylesValid = true;
                    const expectedGroups = Object.keys(testCase.expectedClassStyles);
                    
                    for (const group of expectedGroups) {
                        const expectedProps = testCase.expectedClassStyles[group];
                        const actualProps = classStyles[group] || {};
                        
                        // Log property group comparison
                        resultsEl.innerHTML += `\n- ${group} properties:\n`;
                        resultsEl.innerHTML += `  Expected: ${JSON.stringify(expectedProps)}\n`;
                        resultsEl.innerHTML += `  Actual: ${JSON.stringify(actualProps)}\n`;
                        
                        // Deep comparison is complex, so we'll do a simplified check
                        const expectedKeys = Object.keys(expectedProps);
                        for (const key of expectedKeys) {
                            const hasKey = actualProps[key] !== undefined;
                            if (!hasKey) {
                                resultsEl.innerHTML += formatOutput(`  ❌ Missing property: ${key}\n`, 'fail');
                                allStylesValid = false;
                            } else {
                                resultsEl.innerHTML += formatOutput(`  ✓ Has property: ${key}\n`, 'pass');
                            }
                        }
                    }
                    
                    resultsEl.innerHTML += allStylesValid
                        ? formatOutput(`\n✓ Class styles: PASS\n`, 'pass')
                        : formatOutput(`\n❌ Class styles: FAIL\n`, 'fail');
                    
                    // Output the full result for debugging
                    resultsEl.innerHTML += '\nFull conversion result:\n';
                    resultsEl.innerHTML += JSON.stringify(result, null, 2) + '\n';
                    
                    // Count passed test case
                    if (elementTypeValid && textContentValid && classCountValid && hasClassApplied && allStylesValid) {
                        passedTests++;
                    }
                } catch (err) {
                    resultsEl.innerHTML += formatOutput(`❌ Test failed with error: ${err.message}\n`, 'fail');
                    console.error(err);
                }
            }
            
            // Final results
            resultsEl.innerHTML += formatOutput(`\n🏁 Test summary: ${passedTests}/${testCases.length} passed\n`, 
                                   passedTests === testCases.length ? 'pass' : 'fail');
        }

        // Set up event listener
        document.getElementById('run-test').addEventListener('click', runTests);
    </script>
</body>
</html>
